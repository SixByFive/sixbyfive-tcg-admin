name: Release desktop app

# Push a tag like v1.0.1 to build the Windows installer and publish it to
# the self-hosted update feed. The repo is private, so updates are served
# from our own VPS (apps/desktop/package.json -> build.publish) instead of
# GitHub Releases — no token is shipped inside the app.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's "packageManager" field (pnpm@9.0.0)
      # — pnpm/action-setup errors if it's also specified here.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # node-linker=hoisted avoids pnpm's deeply-nested .pnpm virtual store
      # (folder names like app-builder-lib@25.1.8_dmg-builder@25.1.8_..._<hash>)
      # which pushes some packages' file paths past Windows' 260-char MAX_PATH,
      # breaking electron-builder's NSIS step. Scoped to this CI run only —
      # not changing node-linker for local dev or other apps in the workspace.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      # `...@sixbyfive/desktop` builds the desktop app AND its workspace
      # dependencies (types, api-client) first — those packages' dist/ is
      # gitignored, so it must be built in CI, not just the desktop app
      # itself, or the TypeScript build fails resolving @tcg-admin/* imports.
      - name: Build workspace packages + desktop app
        run: pnpm exec turbo run build --filter=...@sixbyfive/desktop

      - name: Package installer (no auto-publish — we upload it ourselves)
        run: pnpm --filter @sixbyfive/desktop exec electron-builder --publish never

      - name: Upload installer to the update feed via SFTP
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.ADMIN_DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.ADMIN_DEPLOY_SSH_KEY }}
        run: |
          set -e
          RELEASE_DIR="apps/desktop/release"
          KEY_FILE="$RUNNER_TEMP/admin_deploy_key"
          printf '%s\n' "$DEPLOY_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          BATCH_FILE="$RUNNER_TEMP/sftp_batch.txt"
          {
            echo "cd incoming"
            for f in "$RELEASE_DIR"/*.exe "$RELEASE_DIR"/*.exe.blockmap "$RELEASE_DIR"/latest.yml; do
              [ -e "$f" ] || continue
              printf 'put "%s"\n' "$f"
            done
          } > "$BATCH_FILE"

          sftp -i "$KEY_FILE" \
            -o StrictHostKeyChecking=accept-new \
            -b "$BATCH_FILE" \
            admin-deploy@"$DEPLOY_HOST"
